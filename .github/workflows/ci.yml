name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: The jobs to run (python or js, so that the other does not rebuild)
        type: choice
        options: [all, python, js]
        default: all

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: pip install -v ".[test,mcp]"
      - name: OpenCASCADE for the STEP cross-checks
        if: runner.os != 'Windows'
        continue-on-error: true
        run: pip install cadquery-ocp-novtk
      - name: OpenUSD for the USD cross-checks
        continue-on-error: true
        run: pip install usd-core
      # NVIDIA's validator itself (tests/test_closeout_W.py, N4): usd-brep's wheel brings it where it has
      # wheels; on macOS OpenUSD and the asset validator from PyPI, with the submodule's BrepArray rules.
      # No continue-on-error, and SMLIBPY_REQUIRE_USD_VALIDATOR below fails its tests instead of skipping
      # them: a green run of these jobs is a run of the validator.
      - name: NVIDIA's usd-brep for the USD round trips, with its validator (its wheels are for Python 3.12 on Linux and Windows)
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python == '3.12'
        run: pip install "usd-brep[validation]"
      - name: NVIDIA's USD validator (OpenUSD and the asset validator; the BrepArray rules are the submodule's)
        if: runner.os == 'macOS'
        run: pip install "usd-validation-nvidia[usd]"
      - name: Test
        env:
          SMLIBPY_REQUIRE_USD_VALIDATOR: ${{ (runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64' && matrix.python == '3.12')) && '1' || '' }}
        run: |
          pip install pytest-xdist
          pytest -q -n 3 -rfE -p faulthandler

  asan-intel:
    name: AddressSanitizer / macos-15-intel
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install numpy pytest pybind11 ninja
      - name: Build with AddressSanitizer
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKBUILD=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fsanitize-recover=address -fno-omit-frame-pointer" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DPython_EXECUTABLE="$(which python)"
          cmake --build build-asan
      - name: The guard-off fillets of imported parts, alone
        run: python tools/sanitize/run.py --build build-asan --no-leaks tests/test_lane_WN.py -- -k imported
      - name: Tests under the sanitizer
        run: python tools/sanitize/run.py --build build-asan --no-leaks

  js:
    # smlibwasm: the kernel and smlibpy's C++ compiled to WebAssembly, and the TypeScript port with
    # its tests (js/)
    name: JavaScript (WebAssembly)
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'python'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build the module
        run: sh js/scripts/build-wasm.sh
      - name: Install
        working-directory: js
        run: npm ci
      - name: Type check
        working-directory: js
        run: npm run typecheck
      - name: Build the package
        working-directory: js
        run: npm run build
      # NVIDIA's validator itself on toUsd's files (js/test/closeout_W.test.ts, N4), which fails rather
      # than skips without it; the BrepArray rules are the submodule's
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: NVIDIA's USD validator (OpenUSD and the asset validator)
        run: pip install "usd-validation-nvidia[usd]"
      - name: Test
        working-directory: js
        env:
          SMLIBPY_REQUIRE_USD_VALIDATOR: "1"
        run: npm test

  docs:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26"
      - run: mkdocs build --strict
